name: AES scanner

on:
  schedule:
    - cron: "30 5 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = тест, scan = обычный"
        default: "test"
        type: choice
        options: [test, scan]

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "scan" ]; then
            python -m scanner.main
          else
            python -m scanner.main --test
          fi
