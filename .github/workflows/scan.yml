name: AES scanner

on:
  schedule:
    - cron: "30 5 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = тест, scan = обычный, balance = обновить баланс"
        default: "test"
        type: choice
        options: [test, scan, balance]
      balance:
        description: "Новый баланс (только для mode=balance)"
        required: false
        type: string

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: aes-state-${{ github.run_id }}
          restore-keys: |
            aes-state-

      - run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          BAL="${{ github.event.inputs.balance }}"
          if [ "$MODE" = "test" ]; then
            python -m scanner.main --test
          elif [ "$MODE" = "balance" ]; then
            python -m scanner.main --balance "$BAL"
          else
            python -m scanner.main
          fi

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: aes-state-${{ github.run_id }}
